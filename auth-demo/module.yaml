product: jvm/app

dependencies:
  - $ktor.server.netty
  - $ktor.server.auth.jwt
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.server.statusPages
  - $ktor.server.bodyLimit
  - $ktor.server.rateLimit
  - $ktor.server.config.yaml
  - $ktor.client.auth
  - org.bouncycastle:bcprov-jdk18on:1.84
  - ch.qos.logback:logback-classic:1.5.35

test-dependencies:
  - $ktor.server.testHost
  - $ktor.client.contentNegotiation

settings:
  ktor:
    enabled: true
    version: 3.6.0
  kotlin:
    version: 2.4.10
    serialization: enabled
  jvm:
    jdk: { version: 25 }
    release: 25
    mainClass: college.ServerKt

plugins:
  ktor-plugin:
    enabled: true
    docker:
      jreVersion: 25
      platforms: [linux/amd64]
      imageTag: 1.0.1
      hostEnvironmentVariables: [JWT_SECRET]
      externalRegistry:
        namespace: vergauwensimon
        project: avans-college-auth
        credHelper: desktop
