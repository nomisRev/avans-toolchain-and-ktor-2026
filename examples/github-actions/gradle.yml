# Copy to .github/workflows/build.yml in a standalone Gradle backend repository.
# Assumes committed executable wrapper and a configured JVM project using JDK 21.
name: Gradle CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --stacktrace
      # Add configured quality tasks here; see the slides and examples README.
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports
          path: '**/build/reports/**'
          if-no-files-found: warn
          retention-days: 7
