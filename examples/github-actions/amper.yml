# Copy to .github/workflows/build.yml in a Kotlin Toolchain 0.12.2 backend repo.
# Assumes a committed executable ./kotlin wrapper at the repository root, a
# .editorconfig, config/detekt.yml and scripts/coverage-minimum.py from this repo.
name: Amper CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ github.workspace }}/.cache/kotlin/bootstrap
  KOTLIN_SHARED_CACHE_DIR: ${{ github.workspace }}/.cache/kotlin/shared
  # Modules to check, and to aggregate into one coverage report.
  # A single-module project lists just its folder name, e.g. auth-demo.
  MODULES: server shared
  KTFMT: 0.64
  KTLINT: 1.8.0
  DETEKT: 1.23.8
  KOVER: 0.9.11
  MAVEN: https://repo1.maven.org/maven2
  GH: https://github.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cache toolchain downloads
        uses: actions/cache@v6
        with:
          path: .cache/kotlin
          key: >-
            ktc-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('kotlin', '**/*.yaml', '**/*.toml') }}
          restore-keys: ktc-${{ runner.os }}-${{ runner.arch }}-
      # The wrapper provisions its own JDK; the CLI jars need one on PATH.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache CLI tools
        id: tools
        uses: actions/cache@v6
        with:
          path: tools
          key: tools-${{ env.KTFMT }}-${{ env.KTLINT }}-${{ env.DETEKT }}-${{ env.KOVER }}
      - name: Download CLI tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools && cd tools
          curl -fsSLO $MAVEN/com/facebook/ktfmt/$KTFMT/ktfmt-$KTFMT-with-dependencies.jar
          curl -fsSLO $GH/pinterest/ktlint/releases/download/$KTLINT/ktlint
          curl -fsSLO $GH/detekt/detekt/releases/download/v$DETEKT/detekt-cli-$DETEKT-all.jar
          curl -fsSLO $MAVEN/org/jetbrains/kotlinx/kover-jvm-agent/$KOVER/kover-jvm-agent-$KOVER.jar
          curl -fsSLO $MAVEN/org/jetbrains/kotlinx/kover-cli/$KOVER/kover-cli-$KOVER.jar
          chmod +x ktlint

      - name: Collect module paths
        run: |
          OUT=build/artifacts/CompiledJvmArtifact  # internal toolchain path
          for m in $MODULES; do
            SOURCES="$SOURCES $m/src $m/test"
            CLASSES="$CLASSES --classfiles $OUT/${m}jvm/kotlin-output --src $m/src"
          done
          echo "SOURCES=$SOURCES" >> "$GITHUB_ENV"
          echo "CLASSES=$CLASSES" >> "$GITHUB_ENV"

      - name: Formatting (ktfmt)
        run: >-
          java -jar tools/ktfmt-$KTFMT-with-dependencies.jar --kotlinlang-style
          --dry-run --set-exit-if-changed $SOURCES
      - name: Style (ktlint)
        run: |
          set -f  # ktlint expands the ** patterns itself
          tools/ktlint $(printf '%s/**/*.kt ' $SOURCES)
      - name: Analysis (detekt)
        run: >-
          java -jar tools/detekt-cli-$DETEKT-all.jar --input $(echo $SOURCES | tr ' ' ',')
          --config config/detekt.yml --build-upon-default-config
          --report sarif:build/reports/detekt.sarif

      # Every test JVM appends to one file: that is the aggregation.
      - name: Tests with coverage
        run: |
          mkdir -p build/kover
          AGENT="$PWD/tools/kover-jvm-agent-$KOVER.jar"
          ARGS="$PWD/build/kover/agent.args"
          printf 'report.file=%s\nreport.append=true\n' "$PWD/build/kover/coverage.ic" > "$ARGS"
          ./kotlin test $(printf -- '-m %s ' $MODULES) --jvm-args="-javaagent:$AGENT=file:$ARGS"
      # Compiled classes come from an internal toolchain path; revisit it on upgrades.
      - name: Coverage report
        run: >-
          java -jar tools/kover-cli-$KOVER.jar report build/kover/coverage.ic $CLASSES
          --xml build/reports/kover.xml --html build/reports/kover
      - name: Coverage minimum
        run: python3 scripts/coverage-minimum.py build/reports/kover.xml 80

      # JUnit XML, detekt SARIF and the Kover XML/HTML report.
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amper-reports
          path: build/reports/
          if-no-files-found: warn
          retention-days: 7
